name: Fetch assets
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["tools/assets.json", "tools/fetch_assets.py", ".github/workflows/fetch-assets.yml"]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - run: python tools/fetch_assets.py
      - name: Commit images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          git diff --cached --quiet || git commit -m "Add site images"
          git push
